<!DOCTYPE html>
<!--
  Author: Christian Mohlenhoff (cmohlenhoff)
  Course: BMIS 235
  Assignment: HTML-2 · Embedding: Mind, Body, Craft
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="author" content="Christian Mohlenhoff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christian Mohlenhoff's Podcasts</title>
  <style>
    body { font-family: Georgia, serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    .row { display: flex; gap: 1.5rem; list-style: none; padding: 0; }
    .row li { flex: 1; text-align: center; }
    .row img { width: 100%; border-radius: 8px; }
    iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
    .embed-box { padding: 1.5rem; border-radius: 8px; margin-top: 2rem; }
    footer { margin-top: 3rem; font-size: 0.9rem; opacity: 0.8; }
  </style>
</head>
<body id="top">

  <header>
    <h1>Mind, Body, Craft</h1>
    <p>A curated collection of podcasts for focus, health, and mastery.</p>
    <nav>
      <a href="#hubermanlab">Jump to Huberman Lab Video</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Featured Shows</h2>
      <ul class="row">
        <li>
          <img src="huberman.jpg" alt="Huberman Lab Podcast Banner">
          <p><strong>Huberman Lab</strong> — Neuroscience & Health</p>
        </li>
      </ul>
    </section>

    <section id="hubermanlab">
      <h2>Mind & Body: Huberman Lab</h2>
      <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk" title="Huberman Lab Podcast" allowfullscreen></iframe>
    </section>

    <section>
      <h2>Craft & Mastery</h2>
      <iframe src="https://www.youtube.com/embed/5qap5aO4i9A" title="Lofi Girl Radio" allowfullscreen></iframe>
    </section>

    <section class="embed-box">
      <h2>World Population Growth</h2>
      <iframe src="https://ourworldindata.org/grapher/population" loading="lazy" style="width: 100%; height: 600px; border: 0px none;" name="ourworldindata-embed"></iframe>
    </section>
  </main>

  <footer>Built by Christian Mohlenhoff · BMIS 235</footer>

  <script>
    // Simple Dark Mode Toggle
    let lightColor = '#ffffff';
    let darkColor = '#1e1e1e';
    let btn = document.createElement('button');
    btn.innerText = 'Toggle Dark Mode';
    btn.style.margin = '1rem 0';
    document.body.insertBefore(btn, document.querySelector('footer'));
    btn.onclick = () => {
      document.body.style.background = document.body.style.background === 'rgb(30, 30, 30)' ? lightColor : darkColor;
      document.body.style.color = document.body.style.color === 'white' ? 'black' : 'white';
    };
  </script>

</body>
</html>
