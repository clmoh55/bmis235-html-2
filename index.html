<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="author" content="Christian Mohlenhoff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Correia's Podcasts</title>
  <style>
    body { font-family: Georgia, serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    .row { display: flex; gap: 1.5rem; list-style: none; padding: 0; }
    .row li { flex: 1; text-align: center; }
    .row img { width: 100%; border-radius: 8px; }
    iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
    .embed-box { padding: 1.5rem; border-radius: 8px; margin-top: 2rem; }
    footer { margin-top: 3rem; font-size: 0.9rem; opacity: 0.8; }
  </style>
</head>
<body id="top">

  <button onclick="toggleDark()">Dark mode on / off</button>

  <h1>Professor Correia's Podcasts</h1>
  <p>Email me at <a href="mailto:correia@gonzaga.edu">correia@gonzaga.edu</a> for episode suggestions</p>

  <ul class="row">
    <!-- MIND: works ✓ — use this one as your model -->
    <li>
      <h2>For the Mind</h2>
      <a href="#findingmastery"><img src="gervais.jpg" alt="Michael Gervais"></a>
    </li>

    <!-- BODY: fix the image file name and the jump link -->
    <li>
      <h2>For the Body</h2>
      <a href="#hubermanlab"><img src="huberman.jpg" alt="Andrew Huberman"></a>
    </li>

    <!-- CRAFT: image and jump link work ✓ -->
    <li>
      <h2>For the Craft</h2>
      <a href="#lexfridman"><img src="fridman.jpg" alt="Lex Fridman"></a>
    </li>
  </ul>

  <hr>

  <!-- MIND video: works ✓ -->
  <a id="findingmastery"></a>
  <h2>Finding Mastery</h2>
  <iframe src="https://www.youtube.com/embed/fLqzYDZAqCI" title="Finding Mastery" allowfullscreen></iframe>

  <!-- BODY video: works ✓ -->
  <a id="hubermanlab"></a>
  <h2>Huberman Lab</h2>
  <iframe src="https://www.youtube.com/embed/pq6WHJzOkno" title="Huberman Lab" allowfullscreen></iframe>

  <!-- CRAFT video: fix the YouTube link so it plays in an embed -->

  <h2>Lex Fridman Podcast</h2>
  <iframe src="https://www.youtube.com/embed/JN3KPFbWCy8" title="Lex Fridman Podcast" allowfullscreen></iframe>

  <p><a href="#top">To top</a></p>

  <!-- YOUR EMBED BLOCK: paste a Google Map or Our World in Data chart here -->
  <div class="embed-box" id="embedBlock">
    <h2>World Population Growth</h2>
    <iframe src="https://ourworldindata.org/grapher/population" loading="lazy" style="width: 100%; height: 600px; border: 0px none;" allow="web-share; clipboard-write"></iframe>
  </div>

  <footer>Built by Christian Mohlenhoff · BMIS 235</footer>

  <script>
    // 1. Two colors — change these two lines to make it yours
    let lightColor = "#E2E8E4";
    let darkColor  = "#2C5234";

    // 2. A memory of which mode we're in
    let dark = false;

    // 3. Paint the page one color and the embed box the other
    function paint() {
      document.body.style.backgroundColor = dark ? darkColor : lightColor;
      document.body.style.color           = dark ? lightColor : darkColor;
      let box = document.getElementById("embedBlock");
      box.style.backgroundColor           = dark ? lightColor : darkColor;
      box.style.color                     = dark ? darkColor : lightColor;
    }

    // 4. Flip dark mode on click, then repaint
    function toggleDark() {
      dark = !dark;
      paint();
    }

    // 5. Paint once when the page loads
    paint();
  </script>
</body>
</html>
